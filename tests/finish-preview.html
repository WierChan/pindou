<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掀布折角预览</title>
<style>
  body { margin: 0; background: #faf6ef; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  h1 { font-size: 15px; color: #6b5a49; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .lab { font-size: 12px; color: #8a7a68; }

  /* ==== 复刻 iron.wxss 的 peelboard ==== */
  .peelboard {
    position: relative; width: 250px; height: 312px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; border-radius: 16px; overflow: hidden;
    background-color: #e7e0d1;
    background-image: radial-gradient(rgba(120,100,80,.17) 22%, transparent 25%);
    background-size: 12px 12px; background-position: 5px 5px;
    box-shadow: 0 14px 30px rgba(120,100,80,.18), inset 0 0 0 7px #efe9dd, inset 0 0 0 8px rgba(120,100,80,.12);
  }
  .peelcv { display: block; position: relative; z-index: 1; border-radius: 2px; box-shadow: 0 1px 4px rgba(120,100,80,.14); }
  .pcloth-face {
    position: absolute; inset: 0; z-index: 2; background: rgba(247,241,231,.95);
    box-shadow: inset 0 0 28px rgba(198,180,150,.30), inset 0 5px 8px rgba(255,255,255,.6), inset 0 -14px 20px rgba(255,255,255,.2);
  }
  .pcloth-frame { position: absolute; left: 10px; top: 10px; right: 10px; bottom: 10px; border: 1.5px dotted rgba(150,130,110,.4); border-radius: 5px; }
  .pcloth-label { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 11px; letter-spacing: 4px; color: rgba(120,100,80,.3); font-weight: 700; }
  .pcloth-flap {
    position: absolute; inset: 0; z-index: 3; background-color: #f4f0e7;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.75) 0, rgba(255,255,255,.75) 2px, rgba(206,196,180,.55) 2px, rgba(206,196,180,.55) 4px);
    filter: drop-shadow(-2px -2px 4px rgba(90,70,50,.22));
  }
  .peelgrip { position: absolute; right: 12px; bottom: 12px; z-index: 4; width: 30px; height: 30px; border-radius: 50%; background: #E86A7A; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; box-shadow: 0 2px 7px rgba(0,0,0,.22); }
</style>
</head>
<body>
  <h1>掀布折角 · 不同掀开进度（对应参考图的纸张折角揭晓）</h1>
  <div class="row" id="row"></div>
<script>
// 画一个简易苹果（红果蓝格背景），当作成品，验证折角揭晓的样子
function drawPiece(cv) {
  const G = 20, px = 9; cv.width = G*px; cv.height = G*px;
  const c = cv.getContext('2d');
  // 蓝白棋盘背景
  for (let y=0;y<G;y++) for (let x=0;x<G;x++){ c.fillStyle = ((x+y)&1)?'#bfe0f3':'#f4fbff'; c.fillRect(x*px,y*px,px,px); }
  // 红边框
  c.fillStyle = '#e23b3b';
  for (let x=0;x<G;x++){ c.fillRect(x*px,0,px,px); c.fillRect(x*px,(G-1)*px,px,px); }
  for (let y=0;y<G;y++){ c.fillRect(0,y*px,px,px); c.fillRect((G-1)*px,y*px,px,px); }
  // 苹果
  const apple = [[9,5],[10,5],[8,6],[9,6],[10,6],[11,6],[7,7],[8,7],[9,7],[10,7],[11,7],[12,7],
    [6,8],[7,8],[8,8],[9,8],[10,8],[11,8],[12,8],[13,8],[6,9],[7,9],[8,9],[9,9],[10,9],[11,9],[12,9],[13,9],
    [6,10],[7,10],[8,10],[9,10],[10,10],[11,10],[12,10],[13,10],[7,11],[8,11],[9,11],[10,11],[11,11],[12,11],
    [8,12],[9,12],[10,12],[11,12],[9,13],[10,13]];
  c.fillStyle = '#d81e1e'; apple.forEach(([x,y])=>c.fillRect(x*px,y*px,px,px));
  // 梗
  c.fillStyle = '#5a3b1e'; [[10,4],[10,3],[11,3]].forEach(([x,y])=>c.fillRect(x*px,y*px,px,px));
  // 高光
  c.fillStyle = 'rgba(255,255,255,.55)'; [[8,7],[8,8]].forEach(([x,y])=>c.fillRect(x*px,y*px,px,px));
}

function board(pct) {
  const wrap = document.createElement('div'); wrap.className = 'cell';
  const b = document.createElement('div'); b.className = 'peelboard';
  const cv = document.createElement('canvas'); cv.className = 'peelcv';
  cv.style.width = '180px'; cv.style.height = '180px';
  drawPiece(cv);
  const face = document.createElement('div'); face.className = 'pcloth-face';
  face.style.clipPath = `polygon(0 0,100% 0,100% ${100-pct}%,${100-pct}% 100%,0 100%)`;
  face.innerHTML = '<div class="pcloth-frame"></div><div class="pcloth-label">BAKING CLOTH</div>';
  const flap = document.createElement('div'); flap.className = 'pcloth-flap';
  flap.style.clipPath = `polygon(100% ${100-pct}%,${100-pct}% 100%,${100-pct}% ${100-pct}%)`;
  const grip = document.createElement('div'); grip.className = 'peelgrip'; grip.textContent = '↖';
  grip.style.opacity = pct >= 80 ? 0 : 1;
  b.appendChild(cv); b.appendChild(face); b.appendChild(flap); b.appendChild(grip);
  const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = '掀开 ' + pct + '%';
  wrap.appendChild(b); wrap.appendChild(lab);
  return wrap;
}
const row = document.getElementById('row');
[0, 25, 45, 65, 85, 100].forEach(p => row.appendChild(board(p)));
</script>
</body>
</html>
